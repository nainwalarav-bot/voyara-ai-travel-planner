<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyara — Your AI Travel Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Outfit:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#FAF4E9; --paper2:#F2E9D8; --card:#FFFDF6;
  --ink:#14262E; --ink2:#3D5560; --mut:#71858D;
  --line:#E4D8C2;
  --flame:#E4572E; --flame-d:#C43F1B;
  --teal:#0E7C6B; --sky:#37819E; --gold:#DE9A2E; --berry:#A8446B; --moss:#5C8A46;
  --ok:#1D8A5E; --warn:#C43F1B;
  --dark:#0E1B23; --dark2:#152631; --cream:#F6EEDC; --creammut:#B9C4C4;
  --fd:'Fraunces',serif; --fb:'Outfit',sans-serif;
  --r:18px; --sh:0 12px 32px rgba(20,38,46,.10); --sh2:0 4px 14px rgba(20,38,46,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--fb);font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.045'/></svg>")}
h1,h2,h3,.fd{font-family:var(--fd)}
button{font-family:var(--fb);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--fb);font-size:15px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;transition:border .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
::selection{background:var(--flame);color:#fff}
svg.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.hide{display:none!important}

/* ============ COMMON ============ */
.screen{display:none}.screen.on{display:block;animation:fadeUp .5s cubic-bezier(.2,.7,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.overline{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--flame)}
.btn{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:15px;padding:13px 24px;border-radius:999px;transition:transform .16s,box-shadow .16s,background .16s;white-space:nowrap}
.btn:active{transform:scale(.965)}
.btn-ink{background:var(--ink);color:var(--cream)}.btn-ink:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,38,46,.28)}
.btn-flame{background:var(--flame);color:#fff}.btn-flame:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(228,87,46,.35);background:var(--flame-d)}
.btn-ghost{border:1.5px solid var(--ink);color:var(--ink)}.btn-ghost:hover{background:var(--ink);color:var(--cream)}
.btn-sm{padding:8px 16px;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--card)}
.pill.demo{border-color:var(--gold);color:#8a5f10;background:#FBF0D8}
.srcchip{font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--paper2);border-radius:6px;padding:2px 8px;white-space:nowrap}
.checked{font-size:11.5px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:500;font-size:14.5px;cursor:pointer;transition:all .15s;user-select:none}
.chip:hover{border-color:var(--ink2);transform:translateY(-1px)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.chip.on .ic{color:var(--gold)}
.chip .ic{color:var(--ink2)}
.seg{display:inline-flex;flex-wrap:wrap;gap:0;border:1.5px solid var(--line);border-radius:999px;background:var(--card);padding:4px}
.seg button{padding:8px 16px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink2);transition:all .15s}
.seg button.on{background:var(--ink);color:var(--cream)}
.field{margin-bottom:22px}
.field label{display:block;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);margin-bottom:9px}
.hint{font-size:13px;color:var(--mut);margin-top:7px}
.toastwrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--cream);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;display:flex;gap:9px;align-items:center;box-shadow:var(--sh);animation:toastIn .3s cubic-bezier(.2,.9,.3,1.3)}
.toast .ic{color:var(--gold)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.modal{position:fixed;inset:0;z-index:2500;background:rgba(14,27,35,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeUp .25s}
.modal .mbox{background:var(--card);border-radius:22px;max-width:640px;width:100%;max-height:86vh;overflow:auto;box-shadow:var(--sh);position:relative}
.mclose{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--paper2);display:flex;align-items:center;justify-content:center;z-index:2}
.mclose:hover{background:var(--ink);color:var(--cream)}

/* ============ SCENES (poster art) ============ */
.scene{display:block;width:100%;height:100%}
.scene svg{display:block;width:100%;height:100%}
.drift{animation:drift 26s linear infinite}
.drift.d2{animation-duration:38s;animation-delay:-14s}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(460px)}}
.bob{animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.gull{animation:bob 3.4s ease-in-out infinite}

/* ============ LANDING ============ */
.nav{position:sticky;top:0;z-index:900;background:rgba(250,244,233,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:30px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:-.01em}
.logo svg{width:30px;height:30px}
.nav a.nl{font-size:14.5px;font-weight:500;color:var(--ink2);text-decoration:none;cursor:pointer}
.nav a.nl:hover{color:var(--flame)}
.nav .sp{flex:1}
.hero{position:relative;overflow:hidden;background:var(--dark)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);min-height:min(88vh,780px)}
.hero-copy{padding:90px 0 70px 0;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.hero h1{font-size:clamp(46px,5.6vw,84px);line-height:.98;font-weight:560;letter-spacing:-.02em;color:var(--cream);margin:18px 0 24px}
.hero h1 em{font-style:italic;color:var(--flame);font-weight:400}
.hero p.sub{font-size:17.5px;color:var(--creammut);max-width:520px;margin-bottom:34px}
.hero .overline{color:var(--gold)}
.trust{display:flex;flex-wrap:wrap;gap:10px;margin-top:38px}
.trust span{font-size:12.5px;color:var(--creammut);border:1px solid rgba(246,238,220,.25);border-radius:999px;padding:6px 13px;display:inline-flex;gap:7px;align-items:center}
.trust .ic{color:var(--teal)}
.hero-art{position:relative;min-height:420px}
.hero-art .scene{position:absolute;inset:0}
.hero-art::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--dark) 0%,transparent 26%)}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.marquee{background:var(--flame);color:#fff;overflow:hidden;white-space:nowrap;padding:13px 0;border-top:3px solid var(--ink)}
.marquee-in{display:inline-block;animation:tick 34s linear infinite;font-family:var(--fd);font-size:17px;letter-spacing:.06em}
.marquee-in b{font-weight:700}.marquee-in i{font-style:normal;opacity:.55;padding:0 20px}
@keyframes tick{to{transform:translateX(-50%)}}
.sect{padding:96px 0}
.sect-head{max-width:640px;margin-bottom:54px}
.sect-head h2{font-size:clamp(32px,3.6vw,50px);font-weight:560;letter-spacing:-.015em;line-height:1.05;margin-top:14px}
.how{position:relative}
.howrow{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;position:relative}
.howstep{padding-top:26px;border-top:2px solid var(--ink);position:relative}
.howstep:nth-child(2){transform:translateY(44px)}
.howstep:nth-child(3){transform:translateY(88px)}
.howstep .num{font-family:var(--fd);font-size:74px;font-weight:300;font-style:italic;line-height:1;color:var(--flame)}
.howstep h3{font-size:23px;font-weight:600;margin:14px 0 10px}
.howstep p{color:var(--ink2);font-size:15px}
.howpath{position:absolute;top:-8px;left:0;width:100%;height:120px;pointer-events:none}
.howpath path{stroke:var(--ink2);stroke-width:2;fill:none;stroke-dasharray:5 8}
.destrow{display:flex;gap:20px;overflow-x:auto;padding:10px 4px 26px;scroll-snap-type:x mandatory}
.destrow::-webkit-scrollbar{height:8px}.destrow::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.dcard{flex:0 0 262px;scroll-snap-align:start;background:var(--card);border-radius:20px;overflow:hidden;border:1.5px solid var(--line);cursor:pointer;transition:transform .22s,box-shadow .22s;text-align:left}
.dcard:hover{transform:translateY(-6px) rotate(-.4deg);box-shadow:var(--sh)}
.dcard .art{height:158px;position:relative;overflow:hidden}
.dcard:hover .art svg{transform:scale(1.06)}
.dcard .art svg{transition:transform .5s}
.dcard .body{padding:16px 18px 18px}
.dcard h3{font-size:21px;font-weight:600}
.dcard .meta{font-size:13px;color:var(--mut);margin-top:3px}
.dcard .from{margin-top:10px;font-size:13.5px;font-weight:600;color:var(--teal)}
.realdemo{background:var(--dark);color:var(--cream);border-radius:26px;padding:44px 46px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.realdemo h3{font-size:26px;margin-bottom:14px}
.realdemo li{list-style:none;display:flex;gap:11px;margin-bottom:11px;font-size:14.5px;color:var(--creammut)}
.realdemo .ic{margin-top:3px;color:var(--gold)}
.realdemo .ic.ok{color:#5FBF8F}
.realdemo .coltag{font-size:11px;letter-spacing:.18em;font-weight:700;text-transform:uppercase;margin-bottom:14px;display:block}
footer{border-top:1px solid var(--line);padding:44px 0 60px;color:var(--mut);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}

/* ============ ONBOARDING ============ */
.ob{min-height:100vh;display:flex;flex-direction:column}
.ob-top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.ob-top .wrap{display:flex;align-items:center;gap:18px;width:100%}
.ob-prog{flex:1;height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.ob-prog i{display:block;height:100%;background:var(--flame);border-radius:99px;transition:width .45s cubic-bezier(.3,.8,.3,1)}
.ob-grid{flex:1;display:grid;grid-template-columns:340px 1fr;max-width:1180px;margin:0 auto;width:100%;padding:40px 28px 80px;gap:56px}
.rail{position:sticky;top:96px;align-self:start}
.agent{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px;display:flex;gap:14px;box-shadow:var(--sh2)}
.agent .ava{width:44px;height:44px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;color:var(--gold)}
.agent .nm{font-weight:700;font-size:14px}
.agent .nm span{font-weight:500;color:var(--mut);font-size:12px}
.agent p{font-size:13.5px;color:var(--ink2);margin-top:5px;line-height:1.5}
.railsteps{margin-top:26px;display:flex;flex-direction:column;gap:2px}
.rstep{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;font-size:14px;color:var(--mut);font-weight:500;cursor:pointer;transition:all .15s;text-align:left;width:100%}
.rstep .dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none;transition:all .2s}
.rstep.on{color:var(--ink);font-weight:700;background:var(--paper2)}
.rstep.on .dot{background:var(--flame);border-color:var(--flame);color:#fff}
.rstep.done .dot{background:var(--teal);border-color:var(--teal);color:#fff}
.panel h2{font-size:clamp(30px,3.2vw,42px);font-weight:560;letter-spacing:-.015em;margin:6px 0 8px}
.panel .lead{color:var(--ink2);font-size:15.5px;margin-bottom:34px;max-width:520px}
.ob-actions{display:flex;justify-content:space-between;align-items:center;margin-top:44px;gap:14px}
.chiprow{display:flex;flex-wrap:wrap;gap:10px}
.stepcard{display:flex;flex-wrap:wrap;gap:12px}
.selcard{flex:1 1 150px;max-width:230px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 15px;cursor:pointer;transition:all .16s;text-align:left}
.selcard:hover{transform:translateY(-2px);border-color:var(--ink2)}
.selcard.on{border-color:var(--ink);background:var(--ink);color:var(--cream)}
.selcard.on .ic,.selcard.on small{color:var(--gold)}
.selcard .ic{color:var(--flame);font-size:20px}
.selcard b{display:block;font-size:15px;margin:8px 0 3px}
.selcard small{font-size:12.5px;color:var(--mut);line-height:1.4;display:block}
.selcard.on small{color:var(--creammut)}
.stepper{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden}
.stepper button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink2)}
.stepper button:hover{background:var(--paper2);color:var(--ink)}
.stepper b{min-width:56px;text-align:center;font-size:17px}
.rangeval{font-family:var(--fd);font-size:22px;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;background:var(--line);padding:0;border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--flame);border:3px solid var(--card);box-shadow:var(--sh2);cursor:grab}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bigAmt{font-family:var(--fd);font-size:40px;font-weight:600;display:flex;align-items:baseline;gap:12px}
.bigAmt input{font-family:var(--fd);font-size:40px;font-weight:600;border:none;border-bottom:2px solid var(--line);border-radius:0;background:transparent;padding:0 4px;width:250px}
.bigAmt input:focus{border-color:var(--flame)}
.bubble{max-width:86%;padding:13px 17px;border-radius:18px;font-size:14.5px;line-height:1.5;animation:fadeUp .3s}
.bubble.agent{background:var(--paper2);border-bottom-left-radius:5px}
.bubble.user{background:var(--ink);color:var(--cream);margin-left:auto;border-bottom-right-radius:5px}
.qreplies{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0 4px}
.qr{border:1.5px solid var(--flame);color:var(--flame);border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:600;transition:all .15s}
.qr:hover{background:var(--flame);color:#fff}
.typing{display:inline-flex;gap:4px;padding:14px 17px;background:var(--paper2);border-radius:18px;border-bottom-left-radius:5px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink2);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25;transform:none}50%{opacity:1;transform:translateY(-4px)}}
.sumwrap{background:var(--card);border:1.5px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--sh)}
.sumtop{position:relative;height:210px}
.sumtop .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(14,27,35,.55))}
.sumtop .route{position:absolute;bottom:22px;left:30px;right:30px;color:#fff;display:flex;align-items:center;gap:16px}
.sumtop .route b{font-family:var(--fd);font-size:clamp(24px,3.4vw,40px);font-weight:600;letter-spacing:.01em;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.sumtop .route .ln{flex:1;height:2px;background:repeating-linear-gradient(90deg,#fff 0 7px,transparent 7px 14px);opacity:.85;min-width:40px}
.sumbody{padding:28px 30px 30px}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 26px;margin:20px 0 8px}
.sumgrid .k{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mut);margin-bottom:4px}
.sumgrid .v{font-size:16.5px;font-weight:600}
.dotline{display:flex;flex-wrap:wrap;gap:6px 0;align-items:center;font-size:14.5px;font-weight:600}
.dotline i{font-style:normal;color:var(--flame);padding:0 9px}

/* ============ RESEARCH ============ */
.research{min-height:100vh;background:var(--dark);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px;position:relative;overflow:hidden}
.research .overline{color:var(--gold)}
.research h2{font-size:clamp(28px,3.4vw,44px);font-weight:560;margin:10px 0 8px;text-align:center}
.research .rsub{color:var(--creammut);font-size:15px;margin-bottom:34px;text-align:center}
.routewrap{width:min(680px,92vw);margin-bottom:34px}
.rsteps{width:min(680px,92vw)}
.rstep{display:flex;gap:16px;padding:13px 0;align-items:flex-start;opacity:.32;transition:opacity .4s}
.rstep.active,.rstep.done{opacity:1}
.rmark{width:28px;height:28px;border-radius:50%;border:2px solid rgba(246,238,220,.3);display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px;transition:all .3s}
.rstep.active .rmark{border-color:var(--gold);animation:pulse 1.2s infinite}
.rstep.done .rmark{background:var(--teal);border-color:var(--teal);color:#fff}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(222,154,46,.4)}50%{box-shadow:0 0 0 8px rgba(222,154,46,0)}}
.rstep h4{font-size:16.5px;font-weight:600}
.rsub2{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.rsub2 span{font-size:13px;color:var(--creammut);display:flex;gap:8px;align-items:center;animation:fadeUp .3s}
.rsub2 .ic{color:var(--gold);font-size:12px}
.rnote{margin-top:30px;font-size:12.5px;color:var(--creammut);border:1px solid rgba(246,238,220,.2);border-radius:12px;padding:10px 16px;display:flex;gap:10px;align-items:center;max-width:680px}
.rnote .ic{color:var(--gold)}

/* ============ RESULTS ============ */
.rnav{position:sticky;top:0;z-index:900;background:rgba(14,27,35,.94);backdrop-filter:blur(10px);color:var(--cream)}
.rnav .wrap{display:flex;align-items:center;gap:22px;height:60px}
.rnav .logo{font-size:19px;color:var(--cream)}
.rtrip{font-size:13px;font-weight:600;color:var(--creammut);display:flex;align-items:center;gap:8px}
.rtabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.rtabs::-webkit-scrollbar{display:none}
.rtabs button{padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--creammut);white-space:nowrap}
.rtabs button.on{background:var(--cream);color:var(--ink)}
.modeswitch{display:flex;gap:3px;background:rgba(246,238,220,.1);padding:3px;border-radius:999px}
.modeswitch button{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--creammut);transition:all .15s}
.modeswitch button.on{background:var(--flame);color:#fff}
.rhero{position:relative;background:var(--dark);color:var(--cream);overflow:hidden}
.rhero .scene{position:absolute;inset:0;opacity:.9}
.rhero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,27,35,.35) 0%,rgba(14,27,35,.78) 78%,var(--dark) 100%)}
.rhero .wrap{position:relative;z-index:2;padding-top:110px;padding-bottom:60px}

function startHeroCycle(){
  const seq=[PALS.alpine,PALS.ember,PALS.dusk,PALS.alpine];let i=0,t0=performance.now();
  const HOLD=3600,MOVE=4200;
  function frame(t){const els=$$('#heroArt [data-r]');if(!els.length)return;
    const cycle=(t-t0)%(HOLD+MOVE),p=cycle<MOVE?cycle/MOVE:1;
    const A=seq[i%seq.length],B=seq[(i+1)%seq.length];
    els.forEach(el=>{const r=el.dataset.r;if(!A[r])return;const c=mixHex(A[r],B[r],p);
      el.querySelectorAll('[fill]').forEach(n=>n.setAttribute('fill',c));
      el.querySelectorAll('[stroke]').forEach(n=>{if(!n.getAttribute('fill')||n.getAttribute('fill')==='none')n.setAttribute('stroke',c)})});
    if(cycle>=HOLD+MOVE-16)i++;
    heroRAF=requestAnimationFrame(frame)}
  heroRAF=requestAnimationFrame(frame);
}

/* conversational follow-ups (section 3 of the brief) */
let fuState={askedScope:false,askedDiet:false,done:false};
async function runFollowups(){
  fuState={askedScope:!S.scopeTouched,askedDiet:false,done:false};
  const zone=$('#fuZone');if(!zone)return;
  await sleep(500);
  if(!S.scopeTouched){await mayaAsk(zone,'Quick one — does your '+fmt(+S.trip.amount||0)+' budget include transportation, accommodation, food and activities?',
    [['Yes — everything',()=>{S.scopeTouched=true;Object.keys(S.trip.scope).forEach(k=>S.trip.scope[k]=true);mayaSaid('Perfect, I’ll count all of it.')}],
     ['No — travel is separate',()=>{S.scopeTouched=true;S.trip.scope.transport=false;S.trip.scope.local=false;mayaSaid('Got it — I’ll budget stays, food and activities inside '+fmt(+S.trip.amount||0)+'.')}],
     ['Let me set it',()=>{S.scopeTouched=true;mayaSaid('Tap the toggles on this card to adjust what counts.');openModal(`<div style="padding:28px"><h3 class="fd" style="font-size:24px;margin-bottom:16px">What’s inside the budget?</h3><div class="chiprow">${[['transport','Transportation'],['stay','Accommodation'],['food','Food'],['activities','Activities'],['local','Local transport']].map(s=>`<button class="chip ${S.trip.scope[s[0]]?'on':''}" onclick="A.toggleScope('${s[0]}');this.classList.toggle('on')">${s[1]}</button>`).join('')}</div><p class="hint" style="margin-top:14px">Close this dialog when done — the summary remembers.</p></div>`)}]]);
    if(fuState.done)return}
  const foodish=S.trip.food.diet==='none'&&(S.trip.interests.includes('food')||S.trip.interests.includes('culture'));
  if(foodish){await mayaAsk(zone,'Since food experiences matter to you — any dietary needs I should plan meals around?',
    [['No restrictions',()=>{S.trip.food.diet='none';mayaSaid('Easy — everything on the table.')}],
     ['Vegetarian',()=>{S.trip.food.diet='veg';mayaSaid('Noted — every meal suggestion will suit vegetarians.')}],
     ['Vegan',()=>{S.trip.food.diet='vegan';mayaSaid('Noted — vegan-friendly tables only.')}],
     ['Jain',()=>{S.trip.food.diet='jain';mayaSaid('Noted — Jain-suitable options prioritised.')}]])}
  mayaSaid('That’s everything I need. Hit “Start research” when ready.');
  fuState.done=true;
}
async function mayaAsk(zone,q,opts){
  const t1=document.createElement('div');t1.className='typing';t1.innerHTML='<i></i><i></i><i></i>';zone.appendChild(t1);zone.scrollIntoView({behavior:'smooth',block:'nearest'});await sleep(900);t1.remove();
  const b=document.createElement('div');b.className='bubble agent';b.textContent=q;zone.appendChild(b);await sleep(350);
  const r=document.createElement('div');r.className='qreplies';
  opts.forEach(o=>{const bt=document.createElement('button');bt.className='qr';bt.textContent=o[0];
    bt.onclick=()=>{r.remove();const u=document.createElement('div');u.className='bubble user';u.textContent=o[0];zone.appendChild(u);o[1]()};r.appendChild(bt)});
  zone.appendChild(r);await sleep(1200);
}
async function mayaSaid(txt){const zone=$('#fuZone');if(!zone)return;
  const t1=document.createElement('div');t1.className='typing';t1.innerHTML='<i></i><i></i><i></i>';zone.appendChild(t1);await sleep(800);t1.remove();
  const b=document.createElement('div');b.className='bubble agent';b.textContent=txt;zone.appendChild(b)}

 ['Understanding your trip',null],

    </svg></div>
    <div class="rsteps">${RSTEPS.map((s,i)=>`<div class="rstep" id="rs${i}"><span class="rmark" id="rm${i}"></span><div><h4>${s[0]}</h4><div class="rsub2" id="rb${i}"></div></div></div>`).join('')}</div>

    ()=>{P.pax=S.trip.adults+S.trip.children;P.rooms=Math.ceil(S.trip.adults/2)+(S.trip.children?1:0);P.budgetINR=(+S.trip.amount||0)*RATE[S.trip.currency];P.days=Math.max(tripDays()+1,1);
      return [`${esc(S.trip.origin)} → ${prof.name} · ${P.days} days planned`,`Budget ${fmt((+S.trip.amount||0)/RATE[S.trip.currency]*RATE[S.trip.currency])} · ${S.trip.style} style`,`Interests: ${[...S.trip.interests,...S.trip.customInterests].slice(0,4).join(', ')||'open'} · ${dietBadge(S.trip.food.diet).replace(/<[^>]*>/g,'')}`]},
    ()=>{P.transport=prof.transport.map(t=>({...t,checkedAt:nowStamp()}));return [`${prof.transport.length} transport options across ${new Set(prof.transport.map(t=>t.src)).size} sources`,`Fares normalised to group totals · price-stamped ${nowStamp()}`]},
    ()=>{P.hotels=prof.hotels.map(h=>({...h,checkedAt:nowStamp()}));const dupe=P.hotels.find(h=>h.alt);
      P.dedupeNote=dupe?`Merged duplicate: “${dupe.name}” ↔ “${dupe.alt}” (matched on name + area)`:'No duplicates detected';
      return [`${P.hotels.length} stays · duplicates normalised`,P.dedupeNote,`Availability cached at ${nowStamp()} — shown as “when checked”`]},
    ()=>{P.restaurants=prof.restaurants.map(r2=>({...r2,checkedAt:nowStamp()}));const d=S.trip.food.diet;
      const n=d==='none'||d==='any'?P.restaurants.length:P.restaurants.filter(r2=>{const diet=Array.isArray(r2.diet)?r2.diet:[];return diet.includes(d)||(diet.includes('nonveg')&&d==='nonveg')||(d!=='nonveg'&&diet.includes(d));}).length;
      return [`${P.restaurants.length} tables found · ${n} match your ${d==='none'?'open':d} preference`,`Hours & price ranges pulled from map data at ${nowStamp()}`]},
    ()=>{P.activities=prof.activities.map(a=>({...a,checkedAt:nowStamp()}));
      const ints=[...S.trip.interests,...S.trip.customInterests];const m=P.activities.filter(a=>a.tags.some(t=>ints.includes(t))).length;
      return [`${P.activities.length} experiences discovered · ${m} tagged to your interests`,`Opening hours & durations verified at ${nowStamp()}`]},
    ()=>{const cs=prof.center;let far=0,farN='';prof.activities.forEach(a=>{const d=haversine(cs[0],cs[1],a.lat,a.lng);if(d>far){far=d;farN=a.name}});
      return [`${prof.activities.length+P.hotels.length+P.restaurants.length} locations mapped around ${prof.name}`,`Longest hop: ${far.toFixed(1)} km — ${farN}`,`Road-time model: ~${Math.round(prof.road*60)} min per 20 km of mountain/urban road`]},
    ()=>{computePlan(S.mode);const c=P.costs;return [`Best-fit set: ${P.sel.hotel.name} + ${P.sel.transport.title}`,`Estimated ${fmt(c.total)} against ${fmt(+S.trip.amount||0)} — ${c.total<=P.budgetINR?'within budget':'over budget'}`,`Itinerary: ${P.days} days · geo-grouped by area`]}];
  for(let i=0;i<F.length;i++){
    const row=$(`#rs${i}`);row.classList.add('active');mark(i,`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulse 1.2s infinite"></span>`);
    let lines=[];
    try{
      await skippable(600+i*120);
      lines=F[i]();
      for(const l of lines)await skippable(280);
    }catch(err){
      console.error('Voyara research step failed:',RSTEPS[i][0],err);
      lines=[`Demo fallback used for this step`,`The planner recovered automatically`];
    }
    mark(i,ic2('check'));row.classList.remove('active');row.classList.add('done');sub(i,lines);P.checkedAt[RSTEPS[i][0]]=nowStamp();
  }
  await skippable(700);S._skip=null;S.researched=true;computePlan(S.mode);renderResults();
}

   OPTIMIZER (demo computation on placeholder data)

function computePlan(mode){
  const prof=P.prof,t=S.trip;if(!prof)return;
  P.days=P.days||Math.max(tripDays(),3);P.pax=t.adults+t.children;P.rooms=Math.ceil(t.adults/2)+(t.children?1:0);
  P.mode=mode;
  // transport pick
  const wT={cheapest:{cheapest:3,value:2},comfort:{comfort:3,value:1},experience:{value:2,fastest:1},best:{value:3,cheapest:.5,comfort:.5}}[mode]||{value:2};
  P.transport=P.transport.length?P.transport:prof.transport.map(x=>({...x,checkedAt:nowStamp()}));
  const scoredT=P.transport.map(tr=>{let s=0;(tr.tags||[]).forEach(g=>s+=(wT[g]||0)*2);
    if(t.transport.priority&&(tr.tags||[]).includes(t.transport.priority))s+=2.5;
    if(t.transport.modes.length&&!t.transport.modes.includes(tr.mode)&&!(tr.tags||[]).includes('mixed'))s-=4;
    s-=(tr.price/Math.max(P.budgetINR,1))*8;return{tr,s}}).sort((a,b)=>b.s-a.s);
  if(!scoredT.length)return;
  P.sel={transport:scoredT[0].tr};
  // hotel pick
  let cands=P.hotels.length?P.hotels:prof.hotels.map(x=>({...x,checkedAt:nowStamp()}));
  if(t.stay.type!=='no-pref'){const f=cands.filter(h=>h.type===t.stay.type);if(f.length)cands=f}
  cands=cands.filter(h=>h.rating>=t.stay.minRating);if(!cands.length)cands=P.hotels;
  const scoredH=cands.map(h=>{let s=h.rating*2+h.amen.filter(a=>t.stay.amen.includes(a)).length*.5;
    if(mode==='cheapest')s-=h.price/1400;if(mode==='comfort')s+=h.price/2600;if(mode==='experience')s+=h.amen.some(a=>/view|Spa|Pool|Heritage|Beachfront|Rooftop/i.test(a))?1.2:0;
    return{h,s}}).sort((a,b)=>b.s-a.s);
  if(!scoredH.length)return;
  P.sel.hotel=scoredH[0].h;
  P.itin=buildItinerary(mode);
  // costs
  const d=P.days;
  const cTrans=P.sel.transport.price;
  const cStay=P.sel.hotel.price*d*P.rooms;
  let cFood=0,cActs=0;
  P.itin.forEach(day=>day.blocks.forEach(b=>{
    if(b.kind==='meal'&&b.ref)cFood+=(b.ref.pp||0)*P.pax;
    if(b.kind==='act'&&b.ref)cActs+=(b.ref.cost||0)*P.pax*(b.ref.perPp===false?1:1)}));
  const cLocal=Math.round(prof.base?.local?prof.base.local*P.pax*d:(220*P.pax*d));
  const sub2=cTrans+cStay+cFood+cActs+cLocal;
  const bufPct=S._bufPct??10;const cBuf=Math.round(sub2*bufPct/100);
  P.costs={transport:cTrans,stay:cStay,food:cFood,activities:cActs,local:cLocal,buffer:cBuf,bufPct};
  const sc=S.trip.scope;
  P.costs.total=(sc.transport?cTrans:0)+(sc.stay?cStay:0)+(sc.food?cFood:0)+(sc.activities?cActs:0)+(sc.local?cLocal:0)+cBuf;
}
function haversineKm(a,b){if(!a||!b)return 0;return haversine(a[0],a[1],b[0],b[1])}
function pickAct(cands,used,slot){
  let pool=cands.filter(a=>!used.has(a.id));
  if(!pool.length)pool=cands;
  const ints=[...S.trip.interests,...S.trip.customInterests];
  const score=a=>{let s=a.rate*2+((a.tags||[a.tag]).some(t=>ints.includes(t))?3:0);
    if(slot.tag&&(a.tags||[a.tag]).includes(slot.tag))s+=2.5;
    if(P.mode==='cheapest')s-=(a.cost/600);if(P.mode==='comfort')s-=(a.tags||[]).includes('adventure')?1.5:0;if(P.mode==='experience')s+=((a.tags||[a.tag]).some(t=>ints.includes(t))?2:0);
    return s};
  return pool.sort((a,b)=>score(b)-score(a))[0];
}
function pickEat(cands,area,meal){
  const d=S.trip.food.diet;let pool=cands.filter(r2=>{const diet=Array.isArray(r2.diet)?r2.diet:[];return d==='none'||d==='any'||diet.includes(d)||(d!=='nonveg'&&diet.includes(d));});
  if(!pool.length)pool=cands;
  const inArea=pool.filter(r2=>r2.area===area);if(inArea.length&&meal!=='B')pool=inArea.concat(pool.filter(r2=>r2.area!==area));
  return pool[0];
}
function buildItinerary(mode){
  const prof=P.prof,t=S.trip;
  const areaOf=a=>a.area;
  const used=new Set();
  const all=[...(P.activities.length?P.activities:prof.activities)];
  const eats=[...(P.restaurants.length?P.restaurants:prof.restaurants)];
  const relaxed=S.flags.relaxed;
  const first={name:'Arrival & first look',area:null,slots:[{k:'arrive'},{k:'transfer'},{k:'checkin'},{k:'meal',m:'L'},{k:'act',tag:'local'},{k:'meal',m:'D'},{k:'act',tag:'nightlife',opt:true}]};
  const last={name:'Departure & markets',area:null,slots:[{k:'meal',m:'B'},{k:'act',tag:'shopping'},{k:'checkout'},{k:'depart'}]};
  const mids=(prof.dayTpls||[]).slice();
  const midN=P.days-2;const chosen=[];
  for(let i=0;i<midN;i++)chosen.push(mids.length?mids[i%mids.length]:{name:prof.dayNames[(i+1)%prof.dayNames.length]||'Explore',area:null,slots:[{k:'meal',m:'B'},{k:'act',tag:'nature'},{k:'meal',m:'L'},{k:'act',tag:'local'},{k:'meal',m:'D'}]});
  const defs=[first,...chosen,last];
  const days=defs.map((def,di)=>{
    const blocks=[];let prev=null;const usedActs=[];
    const push=(o)=>{blocks.push(o)};
    const mkAct=(slot,time)=>{
      let cands=all.filter(a=>a.area===(slot.area||def.area));
      if(!cands.length)cands=all;
      const a=pickAct(cands,used,slot);if(!a)return;used.add(a.id);usedActs.push(a);
      const km=prev?haversine(prev,[a.lat,a.lng]):0;prev=[a.lat,a.lng];
      push({time,kind:'act',title:a.name,ref:a,km,travel:km>0.15?Math.max(6,Math.round(km*prof.road+8)):0})};
    const mkMeal=(m,slot)=>{
      const area=slot.area||def.area||eats[0].area;
      const r2=pickEat(eats,area,m);if(!r2)return;const c={old:new Date().getTimezoneOffset()};
      let latlng=null;if(P.sel.hotel)latlng=[P.sel.hotel.lat,P.sel.hotel.lng];
      const anchor=prev||latlng||prof.center;
      const km=haversine(anchor[0],anchor[1],r2.lat,r2.lng);prev=[r2.lat,r2.lng];
      push({time:m==='B'?'08:00':m==='L'?'13:00':'20:00',kind:'meal',title:r2.name,ref:r2,m,km,travel:km>0.15?Math.max(5,Math.round(km*prof.road+6)):0})};
    let arr='10:00';
    if(def.slots[0].k==='arrive'){arr=P.sel.transport.arr.split(' ')[0];prev=[P.sel.hotel.lat,P.sel.hotel.lng]}
    def.slots.forEach(slot=>{
      if(slot.opt&&(relaxed||mode==='comfort'&&slot.tag==='nightlife'))return;
      if(relaxed&&(slot.tag==='nightlife'||slot.tag==='photography'))return;
      switch(slot.k){
        case 'arrive':push({time:arr,kind:'arrive',title:'Arrive in '+prof.name,ref:P.sel.transport,km:0,travel:0});break;
        case 'transfer':push({time:addMin(arr,45),kind:'travel',title:'Transfer to '+P.sel.hotel.area,ref:null,km:P.sel.transport.mode==='flight'?47:0,travel:P.sel.transport.mode==='flight'?95:30});break;
        case 'checkin':push({time:addMin(arr,105),kind:'checkin',title:'Check-in · '+P.sel.hotel.name,ref:P.sel.hotel,km:0,travel:0});break;
        case 'meal':mkMeal(slot.m,slot);break;
        case 'act':mkAct(slot,slot.t||addMin(arr,210));break;
        case 'free':push({time:slot.t||'16:00',kind:'free',title:'Free time',ref:null,km:0,travel:0,note:slot.note||'Space to wander — the best hours are unplanned'});break;
        case 'checkout':push({time:'10:00',kind:'checkin',title:'Check-out · luggage storage',ref:P.sel.hotel,km:0,travel:0});break;
        case 'depart':push({time:'14:00',kind:'arrive',title:'Depart for '+(S.trip.origin||'home'),ref:P.sel.transport,km:0,travel:0});break}});
    (S.extras.filter(e=>e.day===di)).forEach(e=>{const a=all.find(x=>x.id===e.id);if(a)push({time:'16:30',kind:'act',title:a.name,ref:a,km:prev?haversine(prev,[a.lat,a.lng]):0,travel:8,extra:true})});
    blocks.sort((a,b)=>a.time.localeCompare(b.time));
    const actKm=blocks.reduce((s,b)=>s+(b.km||0),0);
    return {name:def.name||prof.dayNames[di]||('Day '+(di+1)),blocks,totalKm:Math.round(actKm*10)/10,usedActs};
  });
  return days;
}

function renderEat(){
  const w=$('#eatWrap');if(!w)return;
  w.innerHTML=P.restaurants.map(r=>`<article class="rcard"><div class="art">${scene('food',profPal(),r.id,520,260)}</div><div class="body"><div style="display:flex;justify-content:space-between;gap:10px"><h3>${esc(r.name)}</h3>${dietBadge(r.diet?.includes(S.trip.food.diet)?S.trip.food.diet:(r.diet?.[0]||'any'))}</div><div class="loc">${esc(r.area)} · ${esc(r.cuisine)}</div><div class="rate">${ic2('star')} ${r.rate.toFixed(1)} <small>· ${r.rev.toLocaleString()} reviews</small></div><p class="hint">${esc(r.hrs)} · ${money(r.pp)} per person</p></div></article>`).join('');
}
function renderBudget(){
  const w=$('#budWrap');if(!w)return;const c=P.costs||{};
  const rows=[['transport','Getting there',c.transport],['stay','Stays',c.stay],['food','Food',c.food],['activities','Activities',c.activities],['local','Local transport',c.local],['buffer',`Buffer (${c.bufPct||10}%)`,c.buffer]];
  w.innerHTML=`<div class="budtop"><div><span class="overline" style="color:var(--gold)">Budget</span><div class="budbig">${money(c.total)}</div><div class="budsub">${P.budgetINR?`${money(Math.max(0,P.budgetINR-c.total))} ${c.total<=P.budgetINR?'left':'over'} your budget`: 'No budget entered'}</div></div><div><div class="bar">${rows.map((r,i)=>`<i style="width:${c.total?Math.max(1,r[2]/c.total*100):0}%;background:${CATCOL[r[0]]||'#999'}"></i>`).join('')}</div>${rows.map(r=>`<div class="budrow">${ic2(r[0]==='transport'?'plane':r[0]==='stay'?'bed':r[0]==='food'?'utensils':r[0]==='activities'?'ticket':r[0]==='local'?'car':'spark')}<div><div class="cat">${r[1]}</div><div class="note">Simulated estimate</div></div><div class="amt">${money(r[2])}</div></div>`).join('')}</div></div><div class="budfoot"><div class="rem">Budget: <b>${P.budgetINR?money(P.budgetINR):'—'}</b></div><button class="btn btn-flame" onclick="A.setMode('cheapest')">Make it cheaper ${ic2('arrow')}</button></div><div class="regbox"><h4>Source registry</h4><div class="reggrid">${Object.entries(REGISTRY).map(([k,v])=>`<div class="regcol"><b>${k}</b>${v.map(x=>`<span>${esc(x[0])}<i class="dots">${'•'.repeat(x[2])}</i></span>`).join('')}</div>`).join('')}</div></div>`;
}
function renderMap(){
  const el=$('#mapEl');if(!el||typeof L==='undefined')return;
  if(window.__voyaraMap)window.__voyaraMap.remove();
  const m=L.map(el,{scrollWheelZoom:false}).setView(P.prof.center||[20,78],P.prof.zoom||8);window.__voyaraMap=m;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(m);
  const add=(lat,lng,title,kind)=>L.circleMarker([lat,lng],{radius:8,weight:2,fillOpacity:.9}).addTo(m).bindPopup(`<b>${esc(title)}</b><br>${esc(kind)}`);
  if(P.sel.hotel)add(P.sel.hotel.lat,P.sel.hotel.lng,P.sel.hotel.name,'Stay');
  P.activities.forEach(a=>add(a.lat,a.lng,a.name,'Attraction'));
  P.restaurants.forEach(r=>add(r.lat,r.lng,r.name,'Food'));
  $('#dayToggles').innerHTML=P.itin.map((d,i)=>`<button class="${i===S.daySel?'on':''}" onclick="A.selectDay(${i})">Day ${i+1}</button>`).join('');
}
function renderAssistant(){
  const host=$('#assistHost');if(!host)return;
  host.innerHTML=`<button class="abtn" onclick="A.toggleAssistant()" aria-label="Open travel assistant">${ic2('bot')}</button><div class="apanel hide" id="aPanel"><div class="hd"><div class="ava">${ic2('bot')}</div><div><b>Maya</b><small>Trip assistant</small></div></div><div class="abody" id="aBody"><div class="bubble agent">Your ${esc(P.prof.name)} plan is ready. Ask me to make it cheaper, slower, more adventurous, or change the stay.</div></div><div class="asugg"><button onclick="A.ask('Make it cheaper')">Make it cheaper</button><button onclick="A.ask('More relaxed')">More relaxed</button><button onclick="A.ask('More adventure')">More adventure</button></div><div class="ainput"><input id="aInput" placeholder="Ask Maya…" onkeydown="if(event.key==='Enter')A.ask(this.value)"><button onclick="A.ask($('#aInput').value)">${ic2('arrow')}</button></div></div>`;
}

const A={
 go(screen){if(screen==='landing'){S.step=0;renderLanding()}else if(screen==='onboard'){renderOnboard()}else if(screen==='results'){if(P.prof)renderResults()}},
 start(){S.step=0;renderOnboard()},
 pickDest(k){S.trip.destinations=[DEST[k]?.name||k];S.trip.amount='';S.step=0;renderOnboard()},
 sample(){S.trip={...S.trip,origin:'Delhi',destinations:['Jaipur'],depDate:plusDays(14),retDate:plusDays(19),amount:'50000',adults:2,children:0};S.step=7;renderOnboard()},
 gotoStep(i){S.step=clamp(i,0,OB.length-1);renderOnboard()},
 obBack(){if(S.step===0)renderLanding();else{S.step--;renderOnboard()}},
 obNext(){if(!validateStep(S.step))return;S.step++;renderOnboard()},
 upd(path,val){setPath(S,path,val);if(path==='trip.depDate'&&S.trip.retDate&&S.trip.retDate<S.trip.depDate){S.trip.retDate=''}},
 set(path,val){setPath(S,path,val);renderOnboard()},
 seg(path,val){setPath(S,path,val);renderOnboard()},
 setCur(c){S.trip.currency=c;renderOnboard()},
 qfill(kind,val){if(kind==='origin')S.trip.origin=val;else if(kind==='amount')S.trip.amount=String(val);renderOnboard()},
 qfillDest(k){const name=DEST[k]?.name||k;if(!S.trip.destinations.includes(name))S.trip.destinations.push(name);renderOnboard()},
 addDest(){const el=$('#f_dest');if(!el)return;const v=el.value.trim();if(v&&!S.trip.destinations.includes(v))S.trip.destinations.push(v);renderOnboard()},
 rmDest(i){S.trip.destinations.splice(i,1);renderOnboard()},
 step2(k,d){S.trip[k]=Math.max(k==='adults'?1:0,Math.min(12,S.trip[k]+d));renderOnboard()},
 toggleMode(m){const a=S.trip.transport.modes,i=a.indexOf(m);i<0?a.push(m):a.splice(i,1);renderOnboard()},
 toggleAmen(a){const x=S.trip.stay.amen,i=x.indexOf(a);i<0?x.push(a):x.splice(i,1);renderOnboard()},
 toggleArr(path,val){const a=path.split('.').reduce((o,k)=>o[k],S),i=a.indexOf(val);i<0?a.push(val):a.splice(i,1);renderOnboard()},
 pushArr(path,val){const a=path.split('.').reduce((o,k)=>o[k],S);if(!a.includes(val))a.push(val);renderOnboard()},
 addArr(path,id){const el=$('#'+id),v=el?.value.trim();if(!v)return;A.pushArr(path,v)},
 rmArr(path,i){const a=path.split('.').reduce((o,k)=>o[k],S);a.splice(i,1);renderOnboard()},
 toggleScope(k){S.trip.scope[k]=!S.trip.scope[k];S.scopeTouched=true;const el=document.querySelector(`[data-scope="${k}"]`);if(el)el.classList.toggle('on',S.trip.scope[k])},
 async startResearch(){if(!validateAll())return;await startResearch()},
 skipResearch(){if(S._skip)S._skip();else renderResults()},
 setMode(mode){S.mode=mode;computePlan(mode);renderResults();toast(`Optimised for ${mode}`,'spark')},
 goSec(id,btn){const el=$('#sec-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});if(btn){$$('#rtabs button').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}},
 selectHotel(id){const h=P.hotels.find(x=>x.id===id);if(h){P.sel.hotel=h;computePlan(S.mode);paintResults()}},
 selectTransport(id){const tr=P.transport.find(x=>x.id===id);if(tr){P.sel.transport=tr;computePlan(S.mode);paintResults()}},
 filterTransport(m){S._tfilter=m;renderTransport()},
 selectDay(i){S.daySel=i;renderMap()},
 toggleAssistant(){const p=$('#aPanel');if(p)p.classList.toggle('hide')},
 ask(q){q=String(q||'').trim();if(!q)return;const b=$('#aBody');if(!b)return;const u=document.createElement('div');u.className='bubble user';u.textContent=q;b.appendChild(u);let reply='I can adjust the demo plan. Try “make it cheaper”, “more relaxed”, or “more adventure”.';const l=q.toLowerCase();if(l.includes('cheaper')){S.mode='cheapest';computePlan('cheapest');reply='Done — I re-optimised around lower cost.'}else if(l.includes('relax')){S.flags.relaxed=true;computePlan(S.mode);reply='Done — I removed the optional late/nightlife stops and kept more breathing room.'}else if(l.includes('adventure')){S.mode='experience';computePlan('experience');reply='Done — I pushed the plan toward experiences and interest matches.'}paintResults();setTimeout(()=>{const a=document.createElement('div');a.className='bubble agent';a.textContent=reply;b.appendChild(a);b.scrollTop=b.scrollHeight},300)},
 mclose(){const h=$('#modalHost');if(h)h.innerHTML=''}
};
window.A=A;
function validateStep(i){
  const t=S.trip;
  if(i===0){if(!t.origin.trim()){toast('Add your starting city','x');return false}if(!t.destinations.length){toast('Pick at least one destination','x');return false}if(!t.depDate||!t.retDate){toast('Choose both travel dates','x');return false}if(t.retDate<=t.depDate){toast('Return date must be after departure','x');return false}}
  if(i===1&&!t.amount){toast('Add a budget amount','x');return false}
  if(i===5&&t.interests.length+t.customInterests.length<3){toast('Pick at least three interests','x');return false}
  return true;
}
function validateAll(){return [0,1,5].every(validateStep)}

renderLanding();
</script>
